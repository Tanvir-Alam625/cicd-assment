name: CI/CD Pipeline
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  Test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
    - name: Node.js setup
      uses: actions/setup-node@v2
      with:
        node-version: '24'
    - name: Install dependencies
      run: npm install
    
    - name: Run tests
      run: npm run check